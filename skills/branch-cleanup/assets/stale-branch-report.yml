# Scheduled stale-branch report. Report-only: it never deletes a branch.
#
# Applies the same classification as scripts/stale_branches.py (see
# references/policy.md): a branch is `keep` when protected by a ruleset or
# when an open pull request targets it, `delete` when merged, `archive`
# when unmerged and past the age threshold, `keep` otherwise. The workflow
# writes the table to the job summary only.

name: stale branch report

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  report:
    name: report stale branches
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Report stale branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DAYS: "90"
        run: |-
          set -euo pipefail
          default_branch="$(gh repo view "$REPO" --json defaultBranchRef --jq '.defaultBranchRef.name')"
          summary="$GITHUB_STEP_SUMMARY"
          {
            echo "# Stale branch report"
            echo
            echo "| branch | age (days) | author | merged | open PR | protected | recommendation |"
            echo "|---|---|---|---|---|---|---|"
          } | tee -a "$summary" >/dev/null
          now_epoch="$(date -u +%s)"
          git for-each-ref --format='%(refname:short)' "refs/remotes/origin" \
            | sed 's#^origin/##' \
            | grep -vx -e 'HEAD' -e "$default_branch" \
            | while IFS= read -r branch; do
                ref="origin/$branch"
                commit_date="$(git log -1 --format=%cI "$ref")"
                author="$(git log -1 --format=%an "$ref")"
                commit_epoch="$(date -u -d "$commit_date" +%s)"
                age_days=$(( (now_epoch - commit_epoch) / 86400 ))
                merged="false"
                if git branch -r --merged "$default_branch" | grep -qx "  $ref"; then
                  merged="true"
                fi
                open_pr="false"
                if [ "$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq 'length')" -gt 0 ]; then
                  open_pr="true"
                fi
                protected="false"
                if [ "$(gh api "repos/$REPO/rules/branches/$branch" --jq 'length' 2>/dev/null || echo 0)" -gt 0 ]; then
                  protected="true"
                fi
                recommendation="keep"
                if [ "$protected" = "false" ] && [ "$open_pr" = "false" ]; then
                  if [ "$merged" = "true" ]; then
                    recommendation="delete"
                  elif [ "$age_days" -ge "$DAYS" ]; then
                    recommendation="archive"
                  fi
                fi
                printf '| %s | %s | %s | %s | %s | %s | %s |\n' \
                  "$branch" "$age_days" "$author" "$merged" "$open_pr" "$protected" "$recommendation" \
                  | tee -a "$summary" >/dev/null
              done
