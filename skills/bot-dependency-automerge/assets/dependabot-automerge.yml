# Arms GitHub auto-merge on Dependabot minor and patch PRs when they open.
# Major updates stay open for a human.
# On a GitHub merge-queue branch, gh enables auto-merge or adds the PR to the queue.
# For a third-party merge queue, set QUEUE_LABEL to the label that the queue reads.
# Source: the bot-dependency-automerge skill.
name: dependabot-automerge

on: pull_request

permissions: {}

env:
  QUEUE_LABEL: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  arm:
    name: arm auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == github.event.pull_request.head.repo.full_name
    runs-on: ubuntu-latest
    permissions:
      # When QUEUE_LABEL is set, set contents to read and remove actions. A label needs only pull-requests.
      contents: write # gh pr merge --auto needs write access to merge.
      pull-requests: write # gh pr merge --auto changes the pull request.
      actions: write # Reported fix for arming a PR that changes a workflow file (cli/cli#11493).
    steps:
      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Arm auto-merge for minor and patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |-
          # A third-party merge queue merges the PR. Only hand it the label.
          if [ -n "$QUEUE_LABEL" ]; then
            gh pr edit "$PR_URL" --add-label "$QUEUE_LABEL"
            exit 0
          fi
          # shellcheck disable=SC2016 # $url is a GraphQL variable, not a shell variable.
          query='query($url: URI!) { resource(url: $url) { ... on PullRequest { mergeStateStatus isMergeQueueEnabled } } }'
          state=UNKNOWN
          for _ in 1 2 3 4 5 6; do
            out=$(gh api graphql -f query="$query" -f url="$PR_URL" --jq '.data.resource | "\(.mergeStateStatus) \(.isMergeQueueEnabled)"')
            state=${out% *}
            queue=${out#* }
            [ "$state" != UNKNOWN ] && break
            sleep 10
          done
          # The merge queue sets the merge method. gh never merges directly on a queue branch.
          if [ "$queue" = true ]; then
            gh pr merge --auto "$PR_URL"
            exit 0
          fi
          # Arm only while a required check or review blocks the PR.
          # When nothing blocks it, gh merges at once instead of arming.
          if [ "$state" != BLOCKED ]; then
            echo "::notice::Merge state is $state, not BLOCKED. Auto-merge is not armed; a human merges this PR."
            exit 0
          fi
          gh pr merge --auto --squash "$PR_URL"
