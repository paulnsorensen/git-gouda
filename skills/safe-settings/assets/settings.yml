# Org-level baseline for github-community-projects/safe-settings.
#
# This file lives in the admin repo at `.github/settings.yml` and is
# applied to every repository in the org. Suborg files in `suborgs/`
# and per-repo files in `repos/` override these values.
#
# Schema reference:
#   https://github.com/github-community-projects/safe-settings/blob/2.1.17/docs/sample-settings/settings.yml
#
# This baseline mirrors the gh-bootstrap defaults: squash-only merging, PR title becomes the commit subject, and branches deleted on merge.
# Add a merge_queue rule only when the target organization and plan support it.

repository:
  # Visibility and feature toggles. Comment out fields you want to leave
  # at GitHub's default — every key here is enforced.
  has_issues: true
  # has_projects errors when the target organization has Projects disabled.
  # Confirm Projects support before enabling this org-wide.
  # has_projects: true
  has_wiki: false

  # Merge button: squash only, PR title → commit subject, PR body → commit body.
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  allow_auto_merge: true
  delete_branch_on_merge: true
  allow_update_branch: true
  squash_merge_commit_title: PR_TITLE
  squash_merge_commit_message: PR_BODY

  # Security toggles.
  security:
    enableVulnerabilityAlerts: true
    enableAutomatedSecurityFixes: true

# Org-wide labels. Drives the auto-generated release notes categories
# in `.github/release.yml` of each repo (if present).
#
# labels reconciliation deletes every unlisted label org-wide during
# full-sync. Enable only after the operator inventories existing labels
# across the org and approves the include/exclude list below.
# labels:
#   include:
#     - name: bug
#       color: "d73a4a"
#       description: Something isn't working
#     - name: enhancement
#       color: "a2eeef"
#       description: New feature or request
#     - name: documentation
#       color: "0075ca"
#       description: Improvements or additions to documentation
#     - name: dependencies
#       color: "0366d6"
#       description: Pull requests that update a dependency file
#     - name: breaking-change
#       color: "b60205"
#       description: A change that breaks backwards compatibility
#     - name: chore
#       color: "fef2c0"
#       description: Repo maintenance, no functional change
#     - name: ignore-for-release
#       color: "ededed"
#       description: Exclude this PR from auto-generated release notes
#   # Preserve labels whose name matches these patterns during reconciliation.
#   exclude:
#     - name: '^release'

# Repo name validator. Only adds a validation-error topic to repos whose
# name fails this pattern; it does not block settings reconciliation. Use
# the deployment's restrictedRepos configuration to exclude a repo from sync.
validator:
  pattern: "^[a-z0-9][a-z0-9-]*$"

# Default-branch ruleset — required checks + no force-push. Add a merge queue
# only after confirming GitHub eligibility for the target organization.
# Same shape as the /gh-bootstrap ruleset payload, expressed in YAML and
# applied org-wide.
rulesets:
  - name: main-protection
    target: branch
    enforcement: disabled
    bypass_actors: []
    conditions:
      ref_name:
        include: ["~DEFAULT_BRANCH"]
        exclude: []
      repository_name:
        # Replace this safe example with a narrow selector before activation.
        # Observe the real check names and obtain explicit authorization first.
        include: ["example-repo"]
        exclude: []
        protected: false
    rules:
      - type: deletion
      - type: non_fast_forward
      - type: pull_request
        parameters:
          required_approving_review_count: 1
          dismiss_stale_reviews_on_push: true
          require_code_owner_review: false
          require_last_push_approval: false
          required_review_thread_resolution: true
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: false
          required_status_checks:
            # Replace `ci` with the actual check names your CI emits.
            # Run this on a green PR to see real names:
            #   gh api repos/<org>/<repo>/commits/<sha>/check-runs --jq '.check_runs[].name'
            - context: ci
