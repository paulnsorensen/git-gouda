# Default label set for labels-as-code.
#
# Applied with `gh label create --force` (one-shot) or a sync workflow
# such as crazy-max/ghaction-github-labeler (assets/labels-sync.yml).
# Colors are 6-digit hex without a leading '#'.
#
# type/* mirrors the Conventional Commits types /pr-title-lint checks in
# the PR title. priority/* and status/* are triage labels, not commit
# types. See references/label-scheme.md for how these map onto
# /gh-bootstrap's .github/release.yml categories.

- name: "type/feat"
  color: "1d76db"
  description: "A new feature"
- name: "type/fix"
  color: "d73a4a"
  description: "A bug fix"
- name: "type/docs"
  color: "0075ca"
  description: "Documentation only"
- name: "type/style"
  color: "cfd3d7"
  description: "Formatting, whitespace, no logic change"
- name: "type/refactor"
  color: "c2e0c6"
  description: "Code change that neither fixes a bug nor adds a feature"
- name: "type/perf"
  color: "fbca04"
  description: "A performance improvement"
- name: "type/test"
  color: "bfd4f2"
  description: "Adding or correcting tests"
- name: "type/build"
  color: "5319e7"
  description: "Build system or dependency changes"
- name: "type/ci"
  color: "006b75"
  description: "CI configuration and scripts"
- name: "type/chore"
  color: "e4e669"
  description: "Maintenance work with no source or test impact"
- name: "type/revert"
  color: "b60205"
  description: "Reverts a previous commit"
- name: "priority/critical"
  color: "b60205"
  description: "Drop everything"
- name: "priority/high"
  color: "d93f0b"
  description: "Next in line"
- name: "priority/medium"
  color: "fbca04"
  description: "Normal priority"
- name: "priority/low"
  color: "c2e0c6"
  description: "Nice to have"
- name: "status/blocked"
  color: "000000"
  description: "Waiting on something external"
- name: "status/in-progress"
  color: "fef2c0"
  description: "Actively being worked"
- name: "status/needs-review"
  color: "0e8a16"
  description: "Ready for review"
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"
- name: "dependencies"
  color: "0366d6"
  description: "Dependency updates"
- name: "breaking"
  color: "b60205"
  description: "Breaking change"
