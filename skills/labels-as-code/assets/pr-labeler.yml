# Labels pull requests by the paths they touch.
# Target: .github/workflows/labeler.yml
#
# Reads .github/labeler.yml (assets/labeler.yml is the starting template).
# Reference: https://github.com/actions/labeler#readme
#
# The pinned action runs on Node 24. Self-hosted runners must be
# Actions Runner v2.327.1 or later.

name: labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Label PR by changed paths
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
