# Scheduled sync of .github/labels.yml to the repository's labels.
# Target: .github/workflows/labels-sync.yml
#
# Uses crazy-max/ghaction-github-labeler (verified in
# references/label-scheme.md). skip-delete keeps sync additive until the
# user explicitly authorizes deletions for this repo.
#
# The pinned actions run on Node 24. Self-hosted runners must be
# Actions Runner v2.327.1 or later.

name: labels-sync

on:
  push:
    branches: [main]
    paths:
      - ".github/labels.yml"
      - ".github/workflows/labels-sync.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Sync labels
        uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d # v6.0.0
        with:
          yaml-file: .github/labels.yml
          skip-delete: true
