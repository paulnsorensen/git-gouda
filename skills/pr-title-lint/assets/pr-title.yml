name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # Restrict to these Conventional Commits types (uncomment and edit):
          # types: |
          #   feat
          #   fix
          #   docs
          #   chore
          # Restrict to these scopes (uncomment and edit):
          # scopes: |
          #   api
          #   ui
          requireScope: false
          # Reject a subject that starts with an uppercase letter:
          # subjectPattern: ^(?![A-Z]).+$
