# Repository-local hooks. CI runs the same hooks through just ci.
exclude = "^(\\.git/|\\.cheese/)"

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"] },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-json" },
  { id = "check-toml" },
  { id = "check-merge-conflict", args = ["--assume-in-merge"] },
  { id = "detect-private-key" },
  { id = "check-added-large-files", args = ["--maxkb=1024", "--enforce-all"] }
]
