name: setup-gate
description: Install the pinned tools used by the repository quality gate
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      with:
        just-version: "1.57.0"
    - name: Install gate tooling
      shell: bash
      run: |-
        set -euo pipefail
        npm install -g markdownlint-cli2@0.22.1
        pip install --no-cache-dir yamllint==1.35.1 pyyaml==6.0.2
        curl -fsSLo /tmp/yamlfmt.tar.gz https://github.com/google/yamlfmt/releases/download/v0.21.0/yamlfmt_0.21.0_Linux_x86_64.tar.gz
        echo "1f300d9257b232bb3b541d7fb1b0e6b3c121bcbab381c86cd38cb8722be8a566  /tmp/yamlfmt.tar.gz" | sha256sum -c -
        tar -xzf /tmp/yamlfmt.tar.gz -C /tmp
        sudo install -m 755 /tmp/yamlfmt /usr/local/bin/yamlfmt
        curl -fsSLo /tmp/prek.tar.gz https://github.com/j178/prek/releases/download/v0.5.3/prek-x86_64-unknown-linux-gnu.tar.gz
        echo "c1475ddc56df0003c780557d9b52273d9eb19c9ef8d91143f3ce03511182a36e  /tmp/prek.tar.gz" | sha256sum -c -
        tar -xzf /tmp/prek.tar.gz -C /tmp
        sudo install -m 755 /tmp/prek-x86_64-unknown-linux-gnu/prek /usr/local/bin/prek
